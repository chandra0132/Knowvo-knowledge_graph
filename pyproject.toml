[project]
name = "self-improving-knowledge-graph"
version = "0.1.0"
description = "A Self-Improving Knowledge Graph for Scientific Literature using LLMs and Neo4j"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1.0",
    "pymupdf>=1.23.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.14.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "google-genai>=1.0.0",
    "langfuse>=2.0.0",
    "neo4j-graphrag>=1.0.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "collector",
    "processor",
    "extractor",
    "graph",
    "graphrag",
    "verification",
    "eval",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
